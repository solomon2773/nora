# Default values for the Nora chart.
#
# One Nora release per namespace: Services use fixed compose-parity names
# (backend-api, postgres, redis, ...) so the bundled nginx config and the
# application's connection defaults work unchanged.

global:
  # Registry prefix for the published Nora images.
  imageRegistry: ghcr.io/solomon2773
  # Image tag for all Nora services. Empty resolves to "v<chart appVersion>".
  imageTag: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# Secure defaults for Nora application pods. Component-specific data-store and
# edge contexts live under their own values because their upstream images use
# different numeric users.
security:
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop: ["ALL"]

availability:
  # When a component has more than one replica, keep one available through
  # voluntary disruptions and prefer spreading replicas across nodes.
  podDisruptionBudgets: true
  preferredPodAntiAffinity: true

# Public origin operators will reach Nora on. Feeds NEXTAUTH_URL and
# CORS_ORIGINS. With ingress enabled, set this to https://<ingress host>.
publicUrl: http://localhost:8080

platformMode: selfhosted
# Kubernetes is the only usable agent deploy target when Nora itself runs in a
# pod: the provisioner has no Docker socket in-cluster (see chart README). The
# chart rejects values that omit k8s or include docker instead of silently
# advertising a local target that cannot work.
enabledBackends: k8s
enabledRuntimeFamilies: openclaw
enabledSandboxProfiles: standard

secrets:
  # Name of an existing Secret carrying JWT_SECRET, ENCRYPTION_KEY,
  # NORA_BACKUP_ENCRYPTION_KEY, NORA_API_KEY_HASH_SECRET,
  # NORA_AGENT_HUB_API_KEY_HASH_SECRET, and DB_PASSWORD.
  # The Secret is mounted at /run/secrets for control-plane pods rather than
  # injected wholesale with envFrom. Leave empty to create it from values below.
  existingSecret: ""
  # Required when existingSecret is empty (no insecure defaults are shipped):
  #   openssl rand -hex 32   # for each key below; keep the two hash keys distinct
  jwtSecret: ""
  encryptionKey: ""
  backupEncryptionKey: ""
  apiKeyHashSecret: ""
  # Required and distinct from apiKeyHashSecret for new installs. Upgrades from
  # older chart values may leave it empty to retain the legacy shared-key fallback.
  agentHubApiKeyHashSecret: ""
  dbPassword: ""

# Extra non-secret environment variables applied to backend-api and both
# workers (the control-plane processes). See .env.example for the catalog.
# Canonical chart fields such as ENABLED_BACKENDS, PLATFORM_MODE, DB_HOST, and
# REDIS_HOST are reserved and fail rendering if repeated here.
backendEnv: {}

# Extra environment variables applied to backend-api and both workers after the
# nora-env ConfigMap. Do not put secrets here; use secrets.existingSecret or
# frontendMarketing.oauthExistingSecret. For upgrade compatibility only, the
# five legacy OAuth keys are forwarded selectively to marketing when that
# dedicated Secret is not configured. Canonical chart fields are reserved and
# cannot be overridden through this compatibility map.
commonEnv: {}

# Explicit non-secret frontend allowlist. Frontends never inherit commonEnv or
# the control-plane Secret. Component env maps below add per-frontend values.
frontendEnv: {}

nginx:
  image: nginx:1.29-alpine
  replicas: 1
  service:
    # ClusterIP behind an Ingress; switch to LoadBalancer/NodePort to expose
    # the edge directly.
    type: ClusterIP
    port: 80
    nodePort: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    capabilities:
      drop: ["ALL"]

ingress:
  enabled: false
  className: ""
  host: nora.example.com
  annotations: {}
  tls: []
  # tls:
  #   - secretName: nora-tls
  #     hosts: [nora.example.com]

frontendMarketing:
  replicas: 1
  # Optional Secret containing any of OAUTH_LOGIN_ENABLED, GOOGLE_CLIENT_ID,
  # GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID, and GITHUB_CLIENT_SECRET. Only the
  # marketing deployment can read these optional keys. It may name the same
  # Secret as secrets.existingSecret so the backend loads the OAuth values from
  # /run/secrets while marketing receives only this allowlist.
  oauthExistingSecret: ""
  # Runtime values used only by the marketing/OAuth server, for example
  # API_INTERNAL_URL or NEXTAUTH_URL. Prefer oauthExistingSecret for OAuth data.
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 192Mi

frontendDashboard:
  replicas: 1
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 192Mi

adminDashboard:
  replicas: 1
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 192Mi

backendApi:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

workerProvisioner:
  replicas: 1
  concurrency: 6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

workerBackup:
  enabled: true
  replicas: 1
  concurrency: 2
  resources:
    requests:
      cpu: 50m
      memory: 192Mi

# Kubeconfigs for agent deploy targets registered in Admin -> Kubernetes.
# Point at an existing Secret whose keys are kubeconfig files; it is mounted
# read-only at /kubeconfigs in backend-api and the provisioner.
kubeconfigs:
  existingSecret: ""

# Shared volume for managed local backups (backend-api + worker-backup).
# ReadWriteOnce only works when both pods land on one node (single-node
# clusters such as k3s or Kind). On multi-node clusters use a ReadWriteMany
# storage class here, or configure S3/SSH backup storage in Admin settings
# and disable this volume.
backupsVolume:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

postgresql:
  # In-chart PostgreSQL (official postgres image). Disable to bring your own;
  # then fill in external.* below.
  enabled: true
  image: postgres:15
  auth:
    username: nora
    database: nora
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    capabilities:
      drop: ["ALL"]
  external:
    host: ""
    port: 5432
    username: nora
    database: nora

redis:
  # In-chart Redis (official redis image). Queue state is transient; no
  # persistence by default. Disable to bring your own.
  enabled: true
  image: redis:7
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    capabilities:
      drop: ["ALL"]
  external:
    host: ""
    port: 6379
