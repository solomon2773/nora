name: Nora CodeQL

# `paths` is an allowlist: anything not listed here is never analyzed. Every
# package that ships to a user or an operator belongs in it — including the
# published npm packages (cli, mcp-server), which reach the widest audience of
# anything in the repo, and the dashboards, which handle SSH private keys and
# workspace credentials in the browser.
paths:
  - admin-dashboard
  - agent-runtime
  - backend-api
  - cli
  - frontend-dashboard
  - frontend-marketing
  - mcp-server
  - workers/backup
  - workers/provisioner

# `e2e` is deliberately absent from `paths` rather than listed here: it is test
# harness code that never ships, and its fixtures (hardcoded credentials, fake
# PEM blocks) are exactly the shapes CodeQL is built to flag.
paths-ignore:
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.js"
  - "**/*.test.mjs"
  - "**/node_modules/**"
  - "**/.next/**"
  # Intentionally-shell-executing handler for the agent runtime's /exec
  # endpoint. The container sandbox is the isolation boundary there, not this
  # code. See the file's header for the full rationale.
  - agent-runtime/lib/execEndpoint.ts
