name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/codeql-config.yml"
      - ".github/workflows/ci-codeql.yml"
      - ".github/workflows/scripts/check-codeql-alerts.mjs"
      - ".github/workflows/scripts/check-codeql-alerts.test.mjs"
      - "backend-api/**"
      - "agent-runtime/**"
      - "workers/backup/**"
      - "workers/provisioner/**"
  push:
    branches:
      - master
    paths:
      - ".github/codeql-config.yml"
      - ".github/workflows/ci-codeql.yml"
      - ".github/workflows/scripts/check-codeql-alerts.mjs"
      - ".github/workflows/scripts/check-codeql-alerts.test.mjs"
      - "backend-api/**"
      - "agent-runtime/**"
      - "workers/backup/**"
      - "workers/provisioner/**"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7fc6561ed893d15cec696e062df840b21db27eb0 # v4.35.2
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@7fc6561ed893d15cec696e062df840b21db27eb0 # v4.35.2
        with:
          category: /language:javascript-typescript

  alert-gate:
    name: CodeQL alert gate
    if: ${{ github.event_name != 'pull_request' }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Require the trusted default branch for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "$GITHUB_REF" = "refs/heads/master"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Require zero non-dismissed high or critical results on the exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
        run: node .github/workflows/scripts/check-codeql-alerts.mjs
