name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/codeql-config.yml"
      - ".github/workflows/ci-codeql.yml"
      - ".github/workflows/scripts/check-codeql-alerts.mjs"
      - ".github/workflows/scripts/check-codeql-alerts.test.mjs"
      - "admin-dashboard/**"
      - "agent-runtime/**"
      - "backend-api/**"
      - "cli/**"
      - "frontend-dashboard/**"
      - "frontend-marketing/**"
      - "mcp-server/**"
      - "workers/backup/**"
      - "workers/provisioner/**"
  push:
    branches:
      - master
    paths:
      - ".github/codeql-config.yml"
      - ".github/workflows/ci-codeql.yml"
      - ".github/workflows/scripts/check-codeql-alerts.mjs"
      - ".github/workflows/scripts/check-codeql-alerts.test.mjs"
      - "admin-dashboard/**"
      - "agent-runtime/**"
      - "backend-api/**"
      - "cli/**"
      - "frontend-dashboard/**"
      - "frontend-marketing/**"
      - "mcp-server/**"
      - "workers/backup/**"
      - "workers/provisioner/**"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript

  alert-gate:
    name: CodeQL alert gate
    if: ${{ github.event_name != 'pull_request' }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Require the trusted default branch for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "$GITHUB_REF" = "refs/heads/master"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require zero non-dismissed high or critical results on the exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
        run: node .github/workflows/scripts/check-codeql-alerts.mjs
