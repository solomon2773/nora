name: CI Quality

on:
  workflow_dispatch:
  pull_request:
    paths: &quality_paths
      - ".github/workflows/ci-quality.yml"
      - ".github/workflows/community-response.yml"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/release-docker.yml"
      - ".github/workflows/release-helm.yml"
      - ".github/workflows/release-mcp-registry.yml"
      - ".github/workflows/release-npm.yml"
      - ".github/workflows/scripts/**"
      - ".prettierignore"
      - ".prettierrc.json"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "eslint.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "docs/docs.json"
      - "docs/guides/integrations/**"
      - "tsconfig.base.json"
      - "admin-dashboard/**"
      - "frontend-dashboard/**"
      - "frontend-marketing/**"
      - "backend-api/**"
      - "agent-runtime/**"
      - "workers/backup/**"
      - "workers/provisioner/**"
      - "e2e/**"
      - "mcp-server/**"
      - "cli/**"
      - "infra/helm/nora/**"
  push:
    branches:
      - master
    paths: *quality_paths

permissions:
  contents: read

jobs:
  lint-and-format:
    name: "${{ matrix.check }} (${{ matrix.package }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - admin-dashboard
          - frontend-dashboard
          - frontend-marketing
          - backend-api
          - workers/backup
          - workers/provisioner
          - mcp-server
          - cli
          - scripts
        check:
          - eslint
          - prettier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - id: changed-files
        shell: bash
        env:
          PACKAGE_DIR: ${{ matrix.package }}
          CHECK_KIND: ${{ matrix.check }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-count=1 HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$base" ]; then
            mapfile -t candidates < <(git diff --name-only --diff-filter=ACMR "$base...$EVENT_HEAD_SHA" -- "$PACKAGE_DIR")
          else
            mapfile -t candidates < <(git ls-files "$PACKAGE_DIR")
          fi

          files=()
          for file in "${candidates[@]}"; do
            case "$file" in
              *.js|*.jsx|*.ts|*.tsx|*.cjs|*.mjs)
                files+=("$file")
                ;;
              *.css|*.json|*.yml|*.yaml)
                if [ "$CHECK_KIND" = "prettier" ]; then
                  files+=("$file")
                fi
                ;;
            esac
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "any_changed=true"
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: matrix.check == 'eslint' && steps.changed-files.outputs.any_changed == 'true'
        shell: bash
        run: |
          mapfile -t files < <(printf '%s\n' "${{ steps.changed-files.outputs.files }}")
          npm run ci:lint -- "${files[@]}"
      - if: matrix.check == 'prettier' && steps.changed-files.outputs.any_changed == 'true'
        shell: bash
        run: |
          mapfile -t files < <(printf '%s\n' "${{ steps.changed-files.outputs.files }}")
          npm run ci:format:check -- "${files[@]}"

  typecheck:
    name: "typecheck (${{ matrix.package }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - admin-dashboard
          - frontend-dashboard
          - frontend-marketing
          - backend-api
          - agent-runtime
          - workers/backup
          - workers/provisioner
          - e2e
          - mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.package }}
      - run: npm run typecheck
        working-directory: ${{ matrix.package }}

  extension-contracts:
    name: Extension scaffold contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:scaffolds
      - run: npm run validate:extensions

  community-response-contracts:
    name: Community response contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node --test .github/workflows/scripts/community-response.test.mjs

  repository-metadata-contracts:
    name: Repository metadata contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm run test:repository-metadata

  release-target-contracts:
    name: Release target contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --test .github/workflows/scripts/verify-release-target.test.mjs
      - run: >-
          npx prettier --check
          .github/workflows/release-npm.yml
          .github/workflows/release-mcp-registry.yml
          .github/workflows/scripts/verify-release-target.mjs
          .github/workflows/scripts/verify-release-target.test.mjs

  codeql-alert-gate-contracts:
    name: CodeQL alert gate contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --test .github/workflows/scripts/check-codeql-alerts.test.mjs
      - run: >-
          npx prettier --check
          .github/workflows/ci-codeql.yml
          .github/workflows/ci-quality.yml
          .github/workflows/scripts/check-codeql-alerts.mjs
          .github/workflows/scripts/check-codeql-alerts.test.mjs
