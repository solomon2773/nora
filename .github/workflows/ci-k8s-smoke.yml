name: CI Kubernetes Smoke

# Kubernetes is a GA deploy target with no integration coverage in CI: the
# adapter (workers/provisioner/backends/k8s.ts) is @ts-nocheck so typecheck
# contributes nothing, and the unit suites mock @kubernetes/client-node
# entirely, so a green test run only proves the mocks still match themselves.
# That gap is what made the client-node 2.x bump unverifiable (#381, #384).
#
# e2e/scripts/run-kind-k8s-smoke.sh already does the real thing — kind cluster,
# Calico, a real backend-api and worker-provisioner, then deploys agents through
# the adapter. It just was never wired into CI. This runs it.
#
# Not attached to the blocking Security gate: it stands up a cluster and is
# slower and more environment-sensitive than the unit jobs. It runs on changes
# that can actually break Kubernetes, on a schedule, and on demand.

# STATUS: not yet green on a stock GitHub runner, so this is dispatch-only for
# now. It reaches Kubernetes fine — cluster registration, namespace, deployment
# and service all succeed and the agent pod reaches 1/1 Running — then stalls on
# "Initial runtime readiness failed (timeout after 5000ms)", an HTTP probe from
# the worker-provisioner container to the agent runtime through the kind
# node-port. Five BullMQ retries across ten minutes never connect, and the pod's
# own in-cluster readiness probe passes, so this is the compose-network-to-kind
# routing rather than slowness. Wiring that up is the remaining work.
#
# Left off pull_request and schedule deliberately: a check that always fails
# teaches people to ignore it. Promote it to those triggers once a dispatch run
# goes green.
on:
  workflow_dispatch:
    inputs:
      runtime_families:
        description: "Runtime families to exercise (comma-separated), e.g. hermes"
        required: false
        default: "openclaw,hermes"

permissions:
  contents: read

jobs:
  kind-smoke:
    name: Kind smoke (OpenClaw + Hermes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NORA_ENV_FILE: .env.ci-k8s
      # Scoping to one family halves the run and isolates a family-specific
      # failure instead of waiting through the other one first.
      K8S_SMOKE_RUNTIME_FAMILIES: ${{ inputs.runtime_families || 'openclaw,hermes' }}
      # The smoke script's EXIT trap tears down compose and deletes the kind
      # cluster. On a failure that destroys exactly the state worth looking at
      # before the diagnostics step can read it. The runner is ephemeral, so
      # keeping the environment costs nothing here and makes failures debuggable.
      KEEP_ENV: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      # docker-compose.yml binds six secret FILES out of .secrets/compose, which
      # is gitignored and normally produced by setup.sh. Without them the stack
      # dies before Kubernetes is ever reached ("bind source path does not
      # exist: .secrets/compose/DB_PASSWORD"). .env.test supplies JWT_SECRET,
      # ENCRYPTION_KEY and DB_PASSWORD but leaves the other three empty, and the
      # materializer refuses to write an empty secret, so generate those here.
      # Throwaway values for a throwaway cluster on an ephemeral runner.
      - name: Materialize compose secrets
        run: |
          set -euo pipefail
          cp .env.test .env.ci-k8s
          {
            echo "NORA_BACKUP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "NORA_AGENT_HUB_API_KEY_HASH_SECRET=$(openssl rand -hex 32)"
            echo "NORA_API_KEY_HASH_SECRET=$(openssl rand -hex 32)"
          } >> .env.ci-k8s
          bash scripts/materialize-compose-secrets.sh .env.ci-k8s
      # Follow agent pod logs from the moment each pod appears.
      #
      # A failing provisioning job destroys the deployment, so by the time the
      # diagnostics step runs there is nothing left to read — every attempt to
      # capture the agent container's own output after the fact has come back
      # empty. Following them live is the only way to keep the one piece of
      # evidence that says why a runtime never bound its port.
      - name: Start agent log collector
        run: |
          mkdir -p k8s-smoke-artifacts/podlogs
          cat > /tmp/collect-agent-logs.sh <<'COLLECT'
          #!/usr/bin/env bash
          export KUBECONFIG=/tmp/nora-kind.kubeconfig
          KUBECTL=/tmp/nora-tools/kubectl
          seen=""
          while true; do
            for ns in openclaw-agents hermes-agents; do
              for pod in $("$KUBECTL" -n "$ns" get pods -o name 2>/dev/null); do
                key="${ns}${pod}"
                case " $seen " in *" $key "*) continue ;; esac
                seen="$seen $key"
                safe="$(echo "$key" | tr '/' '-')"
                "$KUBECTL" -n "$ns" logs -f "$pod" --all-containers \
                  > "k8s-smoke-artifacts/podlogs/${safe}.log" 2>&1 &
              done
            done
            sleep 2
          done
          COLLECT
          chmod +x /tmp/collect-agent-logs.sh
          nohup /tmp/collect-agent-logs.sh >/dev/null 2>&1 &
          echo "collector started (pid $!)"
      - name: Run Kind Kubernetes smoke
        run: npm run smoke:k8s-kind
        working-directory: e2e
      # Runs on success too: when this job is red the interesting question is
      # usually "could the worker reach the node port at all", and that answer
      # is worth having in the log either way.
      - name: Probe kind routing from the worker container
        if: always()
        continue-on-error: true
        run: |
          set +e
          CP=nora-kind-control-plane
          KIND_IP="$(docker inspect -f '{{with index .NetworkSettings.Networks "kind"}}{{.IPAddress}}{{end}}' "$CP")"
          echo "== kind control-plane IP: ${KIND_IP}"
          echo "== networks attached to worker-provisioner =="
          docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} ip={{$v.IPAddress}}{{"\n"}}{{end}}' nora-kind-worker-provisioner-1
          echo "== NORA_K8S_* env inside the worker =="
          docker exec nora-kind-worker-provisioner-1 sh -lc 'env | grep -E "^NORA_K8S_" | sort'
          echo "== can the worker reach the node ports? =="
          # Use node, not /dev/tcp: the worker image's sh is not bash, so the
          # earlier /dev/tcp probe reported "unreachable" for every target
          # regardless of the truth.
          docker exec nora-kind-worker-provisioner-1 node -e "
            const net = require('net');
            const http = require('http');
            const host = '${KIND_IP}';
            const check = (port) => new Promise((resolve) => {
              const s = net.connect({ host, port, timeout: 5000 });
              s.on('connect', () => { s.destroy(); resolve('tcp OPEN'); });
              s.on('timeout', () => { s.destroy(); resolve('tcp TIMEOUT'); });
              s.on('error', (e) => resolve('tcp ERROR ' + e.code));
            });
            const get = (port, path) => new Promise((resolve) => {
              const r = http.get({ host, port, path, timeout: 5000 }, (res) => {
                res.resume(); resolve('HTTP ' + res.statusCode);
              });
              r.on('timeout', () => { r.destroy(); resolve('HTTP TIMEOUT'); });
              r.on('error', (e) => resolve('HTTP ERROR ' + e.code));
            });
            (async () => {
              console.log('  runtime 30909 ->', await check(30909), '|', await get(30909, '/health'));
              console.log('  gateway 31879 ->', await check(31879), '|', await get(31879, '/'));
            })();
          "
          echo "== what the control plane recorded for this cluster =="
          docker exec nora-kind-postgres-1 psql -U nora -d nora -At -c \
            "select id, exposure_mode, runtime_host, runtime_node_port, gateway_node_port from kubernetes_clusters" 2>&1 | head -5
          echo "== services and endpoints =="
          export KUBECONFIG=/tmp/nora-kind.kubeconfig
          /tmp/nora-tools/kubectl get svc -A -o wide
          /tmp/nora-tools/kubectl get endpoints -A
          echo "== node port listeners inside the kind node =="
          docker exec "$CP" sh -lc 'ss -lntp 2>/dev/null | grep -E "30909|31879" || echo "(no listener on 30909/31879)"'
          exit 0
      - name: Capture diagnostics
        if: failure()
        continue-on-error: true
        run: |
          set +e
          mkdir -p k8s-smoke-artifacts
          export KUBECONFIG=/tmp/nora-kind.kubeconfig
          /tmp/nora-tools/kubectl get svc -A -o wide > k8s-smoke-artifacts/services.txt 2>&1
          /tmp/nora-tools/kubectl get endpoints -A > k8s-smoke-artifacts/endpoints.txt 2>&1
          /tmp/nora-tools/kubectl get pods -A -o wide > k8s-smoke-artifacts/pods.txt 2>&1
          # Agent container logs. A startup probe that reports "connection
          # refused" only says the port is not bound; the container's own output
          # says why. Both current and previous, since a failing job deletes the
          # deployment and the interesting pod is usually the dead one.
          for ns in openclaw-agents hermes-agents; do
            for pod in $(/tmp/nora-tools/kubectl -n "$ns" get pods -o name 2>/dev/null); do
              safe="$(echo "${ns}-${pod}" | tr '/' '-')"
              /tmp/nora-tools/kubectl -n "$ns" logs "$pod" --all-containers --tail=300 \
                > "k8s-smoke-artifacts/${safe}.log" 2>&1
              /tmp/nora-tools/kubectl -n "$ns" logs "$pod" --all-containers --tail=300 --previous \
                > "k8s-smoke-artifacts/${safe}.previous.log" 2>&1
              /tmp/nora-tools/kubectl -n "$ns" describe "$pod" \
                > "k8s-smoke-artifacts/${safe}.describe.txt" 2>&1
            done
          done
          /tmp/nora-tools/kubectl get events -A --sort-by=.lastTimestamp > k8s-smoke-artifacts/events.txt 2>&1
          /tmp/nora-tools/kubectl describe nodes > k8s-smoke-artifacts/nodes.txt 2>&1
          docker ps -a > k8s-smoke-artifacts/docker-ps.txt 2>&1
          docker logs nora-kind-backend-api-1 > k8s-smoke-artifacts/backend-api.log 2>&1
          docker logs nora-kind-worker-provisioner-1 > k8s-smoke-artifacts/worker-provisioner.log 2>&1
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: k8s-smoke-diagnostics
          path: k8s-smoke-artifacts
          retention-days: 7
