name: Release Helm Chart

# Publishes infra/helm/nora to GHCR's OCI registry for each GitHub release or
# an explicitly selected published release tag. Validation and packaging run
# without package-write access; only the final artifact publisher can write to
# GHCR. Re-running an identical chart version is safe, while changed contents
# under an existing version fail closed.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Published release tag to publish (for example, v1.15.0)
        required: true

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.7.0
  KUBECONFORM_CHECKSUMS_SHA256: 3b8bfbac6e662823a51292368b0c25bc04001a32b006f04aafdf348c091d243f

concurrency:
  group: release-helm-${{ github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Resolve target ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          DISPATCH_REF: ${{ inputs.ref || '' }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "release" ]]; then
            ref="${RELEASE_TAG}"
          else
            ref="${DISPATCH_REF}"
          fi
          # OCI image tags cannot contain SemVer's optional "+build" suffix.
          semver_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "${ref}" =~ ${semver_tag} ]]; then
            echo "::error::Target must be a semantic release tag such as v1.15.0; got '${ref}'."
            exit 1
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve target SHA and tag
        id: target
        env:
          REQUESTED_REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/${REQUESTED_REF}"; then
            echo "::error::Release tag ${REQUESTED_REF} does not exist."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${REQUESTED_REF}^{commit}")"
          if [[ "${tag_sha}" != "${sha}" ]]; then
            echo "::error::Tag ${REQUESTED_REF} resolves to ${tag_sha}, not checked-out SHA ${sha}."
            exit 1
          fi

          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "tag=${REQUESTED_REF}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${REQUESTED_REF} to ${sha}."
      - name: Verify tag has a published GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" --jq '.draft')"
          published_at="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" --jq '.published_at // empty')"
          if [[ "${draft}" != "false" || -z "${published_at}" ]]; then
            echo "::error::Tag ${TARGET_TAG} is not attached to a published GitHub release."
            exit 1
          fi
      - name: Require the release commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "${TARGET_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Release commit ${TARGET_SHA} is not reachable from ${DEFAULT_BRANCH}."
            exit 1
          fi

  verify-required-ci:
    name: Verify CI workflows
    runs-on: ubuntu-latest
    needs: resolve-target
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
      REQUIRED_WORKFLOWS: |
        CI Quality
        CI Compose Pipeline
        CI Security
        CodeQL
        Supply chain
      OPTIONAL_WORKFLOWS: |
        CodeQL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Wait for CI workflows on target commit
        run: node .github/workflows/scripts/require-workflow-success.mjs

  package-chart:
    name: Validate and package Helm chart
    runs-on: ubuntu-latest
    needs:
      - resolve-target
      - verify-required-ci
    permissions:
      contents: read
    outputs:
      name: ${{ steps.chart.outputs.name }}
      version: ${{ steps.chart.outputs.version }}
      app_version: ${{ steps.chart.outputs.app_version }}
    env:
      CHART_DIR: infra/helm/nora
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3
      - name: Install kubeconform
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/kubeconform"
          archive="kubeconform-linux-amd64.tar.gz"
          mkdir -p "${install_dir}"
          release_url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl --retry 3 --retry-all-errors -fsSLo "${install_dir}/${archive}" \
            "${release_url}/${archive}"
          curl --retry 3 --retry-all-errors -fsSLo "${install_dir}/CHECKSUMS" \
            "${release_url}/CHECKSUMS"
          printf '%s  %s\n' "${KUBECONFORM_CHECKSUMS_SHA256}" \
            "${install_dir}/CHECKSUMS" | sha256sum -c -
          expected="$(awk -v name="${archive}" '$2 == name {print $1}' "${install_dir}/CHECKSUMS")"
          test -n "${expected}"
          printf '%s  %s\n' "${expected}" "${install_dir}/${archive}" | sha256sum -c -
          tar -xzf "${install_dir}/${archive}" -C "${install_dir}" kubeconform
          sudo install -m 0755 "${install_dir}/kubeconform" /usr/local/bin/kubeconform
      - name: Validate infrastructure
        run: npm run ci:validate-infra
      - name: Read chart metadata
        id: chart
        env:
          CHART_FILE: infra/helm/nora/Chart.yaml
          VALUES_FILE: infra/helm/nora/values.yaml
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const YAML = require("yaml");

          const chart = YAML.parse(fs.readFileSync(process.env.CHART_FILE, "utf8"));
          const defaults = YAML.parse(fs.readFileSync(process.env.VALUES_FILE, "utf8"));
          const appVersion = String(chart.appVersion || "");
          const values = {
            name: String(chart.name || ""),
            version: String(chart.version || ""),
            app_version: appVersion,
            image_registry: String(defaults.global?.imageRegistry || ""),
            image_tag: String(defaults.global?.imageTag || `v${appVersion}`),
          };

          for (const [key, value] of Object.entries(values)) {
            if (!value || /[\r\n]/.test(value)) {
              throw new Error(`Chart metadata ${key} is empty or invalid.`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE
      - name: Verify tag matches chart appVersion
        env:
          TARGET_TAG: ${{ needs.resolve-target.outputs.tag }}
          APP_VERSION: ${{ steps.chart.outputs.app_version }}
        run: |
          set -euo pipefail
          tag_version="${TARGET_TAG#v}"
          if [[ "${tag_version}" != "${APP_VERSION}" ]]; then
            echo "::error::Tag ${TARGET_TAG} does not match Chart.yaml appVersion ${APP_VERSION}."
            exit 1
          fi
      - name: Wait for chart release images
        env:
          IMAGE_REGISTRY: ${{ steps.chart.outputs.image_registry }}
          IMAGE_TAG: ${{ steps.chart.outputs.image_tag }}
          IMAGE_WAIT_TIMEOUT_SECS: "300"
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
        run: |
          set -euo pipefail
          images=(
            nora-admin-dashboard
            nora-frontend-dashboard
            nora-frontend-marketing
            nora-backend-api
            nora-worker-provisioner
            nora-worker-backup
          )
          deadline=$((SECONDS + IMAGE_WAIT_TIMEOUT_SECS))
          for image in "${images[@]}"; do
            ref="${IMAGE_REGISTRY}/${image}:${IMAGE_TAG}"
            until docker manifest inspect "${ref}" >/dev/null 2>&1; do
              if ((SECONDS >= deadline)); then
                echo "::error::Required chart image is not publicly available: ${ref}"
                exit 1
              fi
              echo "Waiting for ${ref}..."
              sleep 10
            done
            labels="$(docker buildx imagetools inspect "${ref}" \
              --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}|{{ index .Image.Config.Labels "org.opencontainers.image.version" }}')"
            IFS='|' read -r image_revision image_version <<< "${labels}"
            if [[ "${image_revision}" != "${TARGET_SHA}" ]]; then
              echo "::error::${ref} was built from ${image_revision:-an unknown revision}, expected ${TARGET_SHA}."
              exit 1
            fi
            if [[ "${image_version}" != "${IMAGE_TAG}" ]]; then
              echo "::error::${ref} reports version ${image_version:-unknown}, expected ${IMAGE_TAG}."
              exit 1
            fi
            echo "Verified ${ref} at ${TARGET_SHA}."
          done
      - name: Package chart
        id: package
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/helm-package"
          mkdir -p "${package_dir}"
          helm package "${CHART_DIR}" --destination "${package_dir}"
          package_path="${package_dir}/${CHART_NAME}-${CHART_VERSION}.tgz"
          test -f "${package_path}"
          echo "path=${package_path}" >> "${GITHUB_OUTPUT}"
      - name: Upload packaged chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nora-helm-chart
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish-chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    environment: release-publish
    needs:
      - resolve-target
      - package-chart
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}
      CHART_NAME: ${{ needs.package-chart.outputs.name }}
      CHART_VERSION: ${{ needs.package-chart.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Revalidate release provenance after environment approval
        env:
          DISPATCH_TAG: ${{ inputs.ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ needs.resolve-target.outputs.sha }}
          EXPECTED_TAG: ${{ needs.resolve-target.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: node .github/workflows/scripts/verify-release-target.mjs resolve-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nora-helm-chart
          path: ${{ runner.temp }}/helm-package
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3
      - name: Publish chart if version is new
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry/config.json
          PACKAGE_PATH: ${{ runner.temp }}/helm-package/${{ needs.package-chart.outputs.name }}-${{ needs.package-chart.outputs.version }}.tgz
        run: |
          set -euo pipefail
          test -f "${PACKAGE_PATH}"
          mkdir -p "$(dirname "${HELM_REGISTRY_CONFIG}")"
          printf '%s' "${GITHUB_TOKEN}" \
            | helm registry login ghcr.io --username "${GHCR_USERNAME}" --password-stdin
          trap 'helm registry logout ghcr.io >/dev/null 2>&1 || true' EXIT

          chart_ref="${OCI_REGISTRY}/${CHART_NAME}"
          probe_error="${RUNNER_TEMP}/helm-chart-probe.err"
          if helm show chart "${chart_ref}" --version "${CHART_VERSION}" \
            >/dev/null 2>"${probe_error}"; then
            compare_dir="${RUNNER_TEMP}/helm-compare"
            rm -rf "${compare_dir}"
            mkdir -p "${compare_dir}/current" "${compare_dir}/published"
            tar -xzf "${PACKAGE_PATH}" -C "${compare_dir}/current"
            helm pull "${chart_ref}" \
              --version "${CHART_VERSION}" \
              --untar \
              --untardir "${compare_dir}/published"

            if diff -qr \
              "${compare_dir}/current/${CHART_NAME}" \
              "${compare_dir}/published/${CHART_NAME}"; then
              echo "::notice::${CHART_NAME}@${CHART_VERSION} already exists in GHCR with identical contents; skipping."
              exit 0
            fi

            echo "::error::${CHART_NAME}@${CHART_VERSION} already exists in GHCR with different contents. Bump Chart.yaml version before publishing."
            diff -ru \
              "${compare_dir}/published/${CHART_NAME}" \
              "${compare_dir}/current/${CHART_NAME}" || true
            exit 1
          else
            probe_status=$?
            if ! grep -Eqi '(^|[ :])(not found|manifest unknown|name unknown)([ :]|$)|status code 404' \
              "${probe_error}"; then
              cat "${probe_error}" >&2
              echo "::error::Could not determine whether ${CHART_NAME}@${CHART_VERSION} already exists in GHCR."
              exit "${probe_status}"
            fi
          fi

          helm push "${PACKAGE_PATH}" "${OCI_REGISTRY}"
          echo "::notice::Published ${CHART_NAME}@${CHART_VERSION} to ${OCI_REGISTRY}."
