name: CI Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.7.0
  KUBECONFORM_CHECKSUMS_SHA256: 3b8bfbac6e662823a51292368b0c25bc04001a32b006f04aafdf348c091d243f

jobs:
  secret-scan:
    name: Sensitive config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run ci:secret-scan

  # NOTE: npm advisory auditing runs on a schedule (see
  # .github/workflows/dependency-audit.yml), not as a per-PR blocking gate.
  # `npm audit` queries the live GitHub advisory DB, so an unchanged lockfile
  # flips red the moment an unrelated advisory is published — which would block
  # every open PR on advisory-publication timing rather than on anything the PR
  # changed. Dependabot security updates remediate; the scheduled job surfaces
  # regressions daily. Keep only deterministic checks in this blocking gate.

  license-compliance:
    name: "license policy (${{ matrix.package }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - admin-dashboard
          - frontend-dashboard
          - frontend-marketing
          - backend-api
          - agent-runtime
          - workers/backup
          - workers/provisioner
          - e2e
          - mcp-server
          - cli
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: ${{ matrix.package }}
      - run: npm run ci:license-check -- ${{ matrix.package }}

  infra-validation:
    name: Infra validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Install kubeconform
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/kubeconform"
          archive="kubeconform-linux-amd64.tar.gz"
          release_url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          mkdir -p "${install_dir}"
          curl --retry 3 --retry-all-errors -fsSLo "${install_dir}/${archive}" \
            "${release_url}/${archive}"
          curl --retry 3 --retry-all-errors -fsSLo "${install_dir}/CHECKSUMS" \
            "${release_url}/CHECKSUMS"
          printf '%s  %s\n' "${KUBECONFORM_CHECKSUMS_SHA256}" \
            "${install_dir}/CHECKSUMS" | sha256sum -c -
          expected="$(awk -v name="${archive}" '$2 == name {print $1}' "${install_dir}/CHECKSUMS")"
          test -n "${expected}"
          printf '%s  %s\n' "${expected}" "${install_dir}/${archive}" | sha256sum -c -
          tar -xzf "${install_dir}/${archive}" -C "${install_dir}" kubeconform
          sudo install -m 0755 "${install_dir}/kubeconform" /usr/local/bin/kubeconform
      - run: npm run ci:validate-infra

  security-gate:
    name: Security gate
    if: ${{ always() }}
    needs:
      - secret-scan
      - license-compliance
      - infra-validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every security job to succeed
        shell: bash
        env:
          SECURITY_RESULTS: >-
            secret-scan=${{ needs.secret-scan.result }}
            license-compliance=${{ needs.license-compliance.result }}
            infra-validation=${{ needs.infra-validation.result }}
        run: |
          set -euo pipefail
          failed=()
          for job_result in ${SECURITY_RESULTS}; do
            job="${job_result%%=*}"
            result="${job_result#*=}"
            if [ "${result}" != "success" ]; then
              failed+=("${job}=${result}")
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'Security gate failed: %s\n' "${failed[*]}" >&2
            exit 1
          fi

          echo "Every CI Security job succeeded."
