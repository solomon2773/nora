name: Community Response

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
      - ready_for_review
  discussion:
    types:
      - created
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  issues: write
  pull-requests: read

concurrency:
  group: community-response-${{ github.event_name == 'schedule' && 'audit' || github.run_id }}
  cancel-in-progress: false

jobs:
  acknowledge:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'pull_request_target' ||
      github.event_name == 'discussion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Acknowledge and route the new thread
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/scripts/community-response.mjs acknowledge

  audit-response-deadlines:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Remind before the human-response target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/scripts/community-response.mjs audit
