name: Community Response

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
      - ready_for_review
  discussion:
    types:
      - created
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  issues: write
  pull-requests: write

concurrency:
  group: community-response-${{ github.event_name == 'schedule' && 'audit' || github.run_id }}
  cancel-in-progress: false

jobs:
  acknowledge:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'pull_request_target' ||
      github.event_name == 'discussion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Acknowledge and route the new thread
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/scripts/community-response.mjs acknowledge

  audit-response-deadlines:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Remind before the human-response target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/scripts/community-response.mjs audit
